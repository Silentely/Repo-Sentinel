# 构建并推送 RepoSentinel 镜像到 GHCR
#
# 标签策略：
# - main 推送 → main + main-<12 位 sha>（仅 amd64）
# - dev 推送  → dev + dev-<12 位 sha>（仅 amd64）
# - v* 标签   → vX.Y.Z + latest（amd64 + arm64）
# - 手动触发  → 按当前 ref 走对应规则
name: Docker Image

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "web/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/docker.yml"
  # PR 阶段跑 test job（build-and-push 仍只在 push/手动触发）：
  # 此前 PR 无任何检查，问题只能合入 main 后暴露。
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write  # cleanup-old-runs 删除本工作流历史运行记录

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 与 deployments/test/postgres.compose.yml 凭据保持一致；
    # 供 internal/store/contract 的 PostgreSQL 契约测试真实跑迁移（防 int4/bigint 类回归）。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reposentinel_test
          POSTGRES_USER: reposentinel
          POSTGRES_PASSWORD: reposentinel
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U reposentinel -d reposentinel_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Gofmt check
        run: test -z "$(gofmt -l cmd internal migrations)"

      - name: Go test
        run: go test -race ./...
        env:
          # 未设置时契约测试自动 skip；设置后对 PostgreSQL 跑全套运行时契约与迁移
          REPOSENTINEL_TEST_POSTGRES_URL: postgres://reposentinel:reposentinel@127.0.0.1:55432/reposentinel_test?sslmode=disable

      - name: Set up pnpm
        # 先装 pnpm 再加入 PATH：setup-node 的 cache:pnpm 需要 pnpm 可执行文件
        # 定位 store 目录，不能依赖 runner 镜像预装（镜像滚动更新可能移除）。
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # pnpm 依赖缓存：避免每次 CI 全量下载（前端依赖体积大、安装慢）。
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Frontend typecheck & unit tests
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test -- --run

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # e2e 覆盖首次设置/登录/移动端抽屉等关键路径；webServer 经 go run 编译生产构建，
      # 复用 setup-go 的构建缓存。
      - name: Playwright e2e
        working-directory: web
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: .test-run-data/playwright-report
          retention-days: 7

  build-and-push:
    needs: [test]
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # 正式 tag 为双架构 + QEMU，通常 15–30 分钟；main/dev 仅 amd64，约 3–8 分钟
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        # 仅正式 tag 启用 QEMU（跨架构仿真，耗时主要来源）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags and build args
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/repo-sentinel"
          short_sha="${GITHUB_SHA::12}"
          version="$(tr -d '[:space:]' < VERSION)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "platforms=linux/amd64,linux/arm64" >> "${GITHUB_OUTPUT}"
          else
            echo "platforms=linux/amd64" >> "${GITHUB_OUTPUT}"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            {
              echo "tags<<EOF"
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "build_channel=release" >> "${GITHUB_OUTPUT}"
            echo "app_version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            {
              echo "tags<<EOF"
              echo "${image}:main"
              echo "${image}:main-${short_sha}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "build_channel=main" >> "${GITHUB_OUTPUT}"
            echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            {
              echo "tags<<EOF"
              echo "${image}:dev"
              echo "${image}:dev-${short_sha}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "build_channel=dev" >> "${GITHUB_OUTPUT}"
            echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          else
            safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
            {
              echo "tags<<EOF"
              echo "${image}:test-${safe_ref}"
              echo "${image}:test-${short_sha}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "build_channel=test" >> "${GITHUB_OUTPUT}"
            echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          fi

          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          echo "git_branch=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ steps.vars.outputs.platforms }}
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.vars.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ steps.vars.outputs.git_branch }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            BUILD_CHANNEL=${{ steps.vars.outputs.build_channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.app_version }}
            org.opencontainers.image.title=RepoSentinel
            org.opencontainers.image.description=Self-hosted GitHub repository monitoring

  # 每次本工作流运行结束后清理历史：至少保留最近 3 次已完成记录，并删除 3 天前的其余记录。
  # 无 schedule；不依赖构建是否成功/跳过。
  cleanup-old-runs:
    name: Cleanup old workflow runs
    needs: [test, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete old Docker Image runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_FILE: docker.yml
          KEEP_MINIMUM: "3"
          RETAIN_DAYS: "3"
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Listing completed runs for workflow ${WORKFLOW_FILE} (keep>=${KEEP_MINIMUM}, retain_days=${RETAIN_DAYS})"

          # 按时间倒序，最多取 100 条已完成运行
          runs_json="$(
            gh run list \
              --repo "${GH_REPO}" \
              --workflow "${WORKFLOW_FILE}" \
              --status completed \
              --limit 100 \
              --json databaseId,createdAt,displayTitle,conclusion
          )"

          count="$(echo "${runs_json}" | jq 'length')"
          echo "Found ${count} completed run(s)"
          if [[ "${count}" -eq 0 ]]; then
            echo "Nothing to clean"
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          cutoff_epoch="$((now_epoch - RETAIN_DAYS * 86400))"
          deleted=0
          kept=0
          skipped_young=0

          # 索引 0 为最新：前 KEEP_MINIMUM 条始终保留；其余仅当 createdAt 早于 cutoff 时删除
          while IFS=$'\t' read -r run_id created_at; do
            [[ -n "${run_id}" ]] || continue
            # 绝不删除当前这次运行
            if [[ "${run_id}" == "${CURRENT_RUN_ID}" ]]; then
              echo "Skip current run ${run_id}"
              continue
            fi

            kept=$((kept + 1))
            if [[ "${kept}" -le "${KEEP_MINIMUM}" ]]; then
              echo "Keep recent #${kept}: ${run_id} (${created_at})"
              continue
            fi

            created_epoch="$(date -u -d "${created_at}" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "${created_at}" +%s 2>/dev/null || echo 0)"
            if [[ "${created_epoch}" -eq 0 ]]; then
              echo "Skip unparsable date for run ${run_id}: ${created_at}"
              continue
            fi

            if [[ "${created_epoch}" -ge "${cutoff_epoch}" ]]; then
              echo "Keep (within ${RETAIN_DAYS}d): ${run_id} (${created_at})"
              skipped_young=$((skipped_young + 1))
              continue
            fi

            echo "Delete old run ${run_id} (${created_at})"
            if gh api --method DELETE "repos/${GH_REPO}/actions/runs/${run_id}" >/dev/null; then
              deleted=$((deleted + 1))
            else
              echo "Warning: failed to delete run ${run_id}" >&2
            fi
          done < <(echo "${runs_json}" | jq -r '.[] | "\(.databaseId)\t\(.createdAt)"')

          echo "Cleanup done: deleted=${deleted}, recent_kept_slots=${KEEP_MINIMUM}, young_extra_kept=${skipped_young}"
