# 构建并推送 RepoSentinel 镜像到 GHCR
#
# 标签策略：
# - main 推送 → main + main-<12 位 sha>（仅 amd64）
# - dev 推送  → dev + dev-<12 位 sha>（仅 amd64）
# - v* 标签   → vX.Y.Z + latest（amd64 + arm64）
# - 手动触发  → 按当前 ref 走对应规则
name: Docker Image

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "web/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Frontend typecheck & unit tests
        working-directory: web
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test -- --run

  build-and-push:
    needs: [test]
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # 正式 tag 为双架构 + QEMU，通常 15–30 分钟；main/dev 仅 amd64，约 3–8 分钟
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        # 仅正式 tag 启用 QEMU（跨架构仿真，耗时主要来源）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags and build args
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/repo-sentinel"
          short_sha="${GITHUB_SHA::12}"
          version="$(tr -d '[:space:]' < VERSION)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "platforms=linux/amd64,linux/arm64" >> "${GITHUB_OUTPUT}"
          else
            echo "platforms=linux/amd64" >> "${GITHUB_OUTPUT}"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            {
              echo "tags<<EOF"
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "build_channel=release" >> "${GITHUB_OUTPUT}"
            echo "app_version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            {
              echo "tags<<EOF"
              echo "${image}:main"
              echo "${image}:main-${short_sha}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "build_channel=main" >> "${GITHUB_OUTPUT}"
            echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            {
              echo "tags<<EOF"
              echo "${image}:dev"
              echo "${image}:dev-${short_sha}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "build_channel=dev" >> "${GITHUB_OUTPUT}"
            echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          else
            safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
            {
              echo "tags<<EOF"
              echo "${image}:test-${safe_ref}"
              echo "${image}:test-${short_sha}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "build_channel=test" >> "${GITHUB_OUTPUT}"
            echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          fi

          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          echo "git_branch=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ steps.vars.outputs.platforms }}
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.vars.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ steps.vars.outputs.git_branch }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            BUILD_CHANNEL=${{ steps.vars.outputs.build_channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.app_version }}
            org.opencontainers.image.title=RepoSentinel
            org.opencontainers.image.description=Self-hosted GitHub repository monitoring
