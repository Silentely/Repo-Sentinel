# 构建并推送 RepoSentinel 镜像到 GHCR
#
# 标签策略：
# - main 推送 → main + main-<12 位 sha>（仅 amd64）
# - dev 推送  → dev + dev-<12 位 sha>（仅 amd64）
# - v* 标签   → vX.Y.Z + latest（amd64 + arm64）
# - 手动触发  → 按当前 ref 走对应规则
name: Docker Image

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "web/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/docker.yml"
  # PR 阶段跑 test job（build-and-push 仍只在 push/手动触发）：
  # 此前 PR 无任何检查，问题只能合入 main 后暴露。
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 与 deployments/test/postgres.compose.yml 凭据保持一致；
    # 供 internal/store/contract 的 PostgreSQL 契约测试真实跑迁移（防 int4/bigint 类回归）。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reposentinel_test
          POSTGRES_USER: reposentinel
          POSTGRES_PASSWORD: reposentinel
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U reposentinel -d reposentinel_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Gofmt check
        run: |
          diffs="$(gofmt -l cmd internal migrations)"
          if [ -n "$diffs" ]; then
            echo "::error::Unformatted files found:"
            echo "$diffs"
            gofmt -d cmd internal migrations
            exit 1
          fi

      # ent 产物随 Go 工具链漂移：Go 1.27+ 会把 JSON 字段生成为
      # encoding/json/jsontext.Value，而本作业按 go.mod 使用 Go 1.26（jsontext 处于
      # jsonv2 实验门后）无法编译。重跑 codegen 并断言零 diff，让漂移在 CI 当场暴露。
      - name: Ent codegen freshness check
        run: |\
          go generate ./internal/store/ent/...
          if [ -n "$(git status --porcelain -- internal/store/ent)" ]; then
            git status --porcelain -- internal/store/ent
            git diff -- internal/store/ent
            echo "::error::internal/store/ent 产物已过期（schema 变更或工具链漂移）。请用 go.mod 声明的 Go 版本重跑 go generate ./internal/store/ent/... 并提交产物。"
            exit 1
          fi

      - name: Go test
        run: go test -race ./...
        env:
          # 未设置时契约测试自动 skip；设置后对 PostgreSQL 跑全套运行时契约与迁移
          REPOSENTINEL_TEST_POSTGRES_URL: postgres://reposentinel:reposentinel@127.0.0.1:55432/reposentinel_test?sslmode=disable

      - name: Set up pnpm
        # 先装 pnpm 再加入 PATH：setup-node 的 cache:pnpm 需要 pnpm 可执行文件
        # 定位 store 目录，不能依赖 runner 镜像预装（镜像滚动更新可能移除）。
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # pnpm 依赖缓存：避免每次 CI 全量下载（前端依赖体积大、安装慢）。
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Frontend lint, typecheck & unit tests
        working-directory: web
        run: |\
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test -- --run

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # e2e 覆盖首次设置/登录/移动端抽屉等关键路径；webServer 经 go run 编译生产构建，
      # 复用 setup-go 的构建缓存。
      - name: Playwright e2e
        working-directory: web
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: .test-run-data/playwright-report
          retention-days: 7

  build-and-push:
    permissions:
      contents: read
      packages: write
    needs: test
    # 仅在非 PR（即分支 push 或打标签或手动触发）时执行镜像构建与推送
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        # 仅 v* 标签需要构建 arm64 镜像，主/开发分支仅构建 amd64 节省 CI 时间
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate metadata & tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"
          TAGS=""
          PLATFORMS="linux/amd64"

          # 获取 12 位短 SHA
          SHORT_SHA=$(git rev-parse --short=12 HEAD)

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
            PLATFORMS="linux/amd64,linux/arm64"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${IMAGE}:main,${IMAGE}:main-${SHORT_SHA}"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            TAGS="${IMAGE}:dev,${IMAGE}:dev-${SHORT_SHA}"
          else
            TAGS="${IMAGE}:temp-${SHORT_SHA}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
