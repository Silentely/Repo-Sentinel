# RepoSentinel 示例配置。
# Secret 不写入本文件；请按各段注释使用对应环境变量注入。

http:
  # HTTP 监听地址，必须包含主机和端口。
  addr: "127.0.0.1:8080"
  # 对外访问地址；生产环境使用 HTTPS，本地开发可留空。
  public_base_url: ""

database:
  # 数据库驱动可选 sqlite 或 postgres。
  driver: "sqlite"
  # SQLite 文件地址；PostgreSQL 部署时可通过 REPOSENTINEL_DATABASE_URL 注入连接地址。
  url: "file:/data/reposentinel.db"
  # SQLite 默认最大打开连接数为 1；PostgreSQL 未显式设置时为 10。
  max_open_conns: 1
  # SQLite 默认最大空闲连接数为 1。
  max_idle_conns: 1

admin:
  # 初始管理员用户名；若填写，密码必须通过 REPOSENTINEL_ADMIN_PASSWORD 同时提供。
  username: ""
  # 管理员会话有效期，使用 Go duration 格式。
  session_ttl: "24h"

setup:
  # 是否明确允许来源 IP 或请求 Host 非 loopback 的首次设置。
  allow_remote: false

encryption: {}
# 当前主密钥通过 REPOSENTINEL_ENCRYPTION_KEY 提供。
# 上一把轮换密钥通过 REPOSENTINEL_ENCRYPTION_KEY_PREVIOUS 提供。

github:
  # GitHub App 数字 ID。
  app_id: 0
  # GitHub App Client ID。
  client_id: ""
  # GitHub App 私钥文件路径；文件内容不写入配置。
  private_key_path: ""
  # 入站：GitHub → 本服务。Secret 通过 REPOSENTINEL_GITHUB_WEBHOOK_SECRET 提供。
  # 上一把入站 Secret 通过 REPOSENTINEL_GITHUB_WEBHOOK_PREVIOUS_SECRET 提供。
  # 外部仓库 PAT 通过 REPOSENTINEL_EXTERNAL_PAT 提供。

notify:
  telegram:
    # Telegram 目标 Chat ID。
    chat_id: ""
    # Bot Token 通过 REPOSENTINEL_TELEGRAM_TOKEN 提供。
  http_webhook:
    # 出站：本服务 → 你的接收端 HTTPS URL（也可用管理台「渠道配置」填写）。
    url: ""
    # 是否允许通知发送到私网地址。
    allow_private: false
    # 出站签名 Secret 通过 REPOSENTINEL_HTTP_WEBHOOK_SECRET 提供（可选）。
    # 与 REPOSENTINEL_GITHUB_WEBHOOK_SECRET 无关；管理台同名字段为同一用途的运行时配置。

logging:
  # 日志格式可选 json 或 text。
  format: "json"
  # 日志级别可选 debug、info、warn 或 error。
  level: "info"

metrics:
  # 是否暴露 GET /metrics（Prometheus 文本格式）。
  enabled: true
  # 可选 Bearer Token；通过 REPOSENTINEL_METRICS_TOKEN 注入，非空时要求 Authorization: Bearer <token>。

update_check:
  # 是否启用关于页远程版本检查；内网部署可关闭，检查失败仅降级展示不影响服务。
  enabled: true
  # 版本检查 JSON 源；默认 GitHub releases API，可替换为自定义 HTTPS 源。
  url: "https://api.github.com/repos/Silentely/Repo-Sentinel/releases/latest"
  # 可选访问令牌（私有源或提高配额）；通过 REPOSENTINEL_UPDATE_CHECK_TOKEN 注入。

aggregation:
  # 同仓同类事件的短时合并窗口，使用 Go duration 格式。
  window: "60s"
  # 超频阈值；窗口内同渠道事件数超过后转为摘要通知。
  burst_threshold: 15
  # 超频统计窗口，使用 Go duration 格式。
  burst_window: "5m"
  # 多实例时合并与摘要依赖 Outbox 幂等键去重，进程内合并仍为 best-effort。

ai:
  # 可选 LLM 集成（每日摘要 / 周报月报 / 安全告警分诊），默认关闭。
  enabled: false
  # OpenAI 兼容端点；可指向本地模型网关（如 Ollama http://127.0.0.1:11434/v1）。
  base_url: "https://api.openai.com/v1"
  # 模型名。
  model: "gpt-4o-mini"
  # 单次请求超时，使用 Go duration 格式。
  timeout: "20s"
  # 输出 token 上限。
  max_tokens: 800
  # 是否启用 AI 摘要（每日/周报/月报）。
  digest_enabled: true
  # 是否启用实时安全告警 AI 分诊。
  triage_enabled: true
  # API Key 通过 REPOSENTINEL_AI_API_KEY 注入；enabled=true 时必须提供。
