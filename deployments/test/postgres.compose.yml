services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reposentinel_test
      POSTGRES_USER: reposentinel
      POSTGRES_PASSWORD: reposentinel
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reposentinel -d reposentinel_test"]
      interval: 1s
      timeout: 5s
      retries: 30
